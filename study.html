<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study - FlashDeckAi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'bg-base': '#09090B',
                        'bg-surface': '#18181B',
                        'bg-overlay': '#27272A',
                        'border-subtle': '#3F3F46',
                        'text-muted': '#A1A1AA',
                        'on-surface': '#FAFAFA',
                        'electric-orange': '#F97316',
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                        display: ['Cal Sans', 'Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.cdnfonts.com/css/cal-sans');
        body { font-family: 'Inter', sans-serif; background-color: #09090B; color: #FAFAFA; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Flip Card CSS */
        .flip-card {
            background-color: transparent;
            perspective: 1000px;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
        }
        .flip-card-front {
            /* Keep it slightly transparent so we see the background of the inner card if needed */
        }
        .flip-card-back {
            transform: rotateY(180deg);
            overflow-y: auto;
            justify-content: flex-start;
        }

        /* Matching the Anki export CSS classes for study preview */
        .card-content { font-family: 'Inter', sans-serif; font-size: 20px; text-align: center; color: #e0e0e0; }
        .word { font-size: 36px; font-weight: bold; color: #3b82f6; margin-bottom: 5px; }
        .sub-word { font-size: 20px; font-weight: bold; color: #e0e0e0; margin-bottom: 2px; }
        .pos { font-size: 18px; font-weight: bold; color: #888; margin-bottom: 10px; }
        .root { font-size: 18px; color: #aaa; margin-bottom: 15px; }
        .root-badge {
            display: inline-block;
            background: #27272A;
            border-radius: 12px;
            padding: 4px 12px;
            font-size: 14px;
            font-weight: bold;
            color: #FAFAFA;
            margin-bottom: 20px;
            border: 1px solid #3F3F46;
            align-self: center;
        }
        .root-badge-label {
            color: #888;
            font-size: 12px;
            margin-right: 4px;
        }

        .translation { font-size: 22px; font-weight: bold; color: #e0e0e0; margin-bottom: 5px; }
        .example-block { margin-top: 15px; margin-bottom: 15px; }
        .example { font-size: 20px; font-weight: normal; margin-bottom: 3px; color: #e0e0e0; }
        .example-trans { font-size: 18px; color: #aaa; font-style: italic; }
        hr.card-hr { border: 0; border-bottom: 1px solid #27272A; margin: 25px 0; }

        .play-btn {
            background: #18181B;
            color: #FAFAFA;
            border: 1px solid #3F3F46;
            padding: 6px 14px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-top: 8px;
            margin-bottom: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .play-btn:hover { background: #27272A; border-color: #52525B; }
        .play-btn svg { width: 16px; height: 16px; margin-right: 6px; }

        .word-block {
            margin-bottom: 30px;
            background: #18181B;
            border: 1px solid #27272A;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden antialiased">
    <!-- Navbar -->
    <nav class="bg-bg-surface shadow-md p-4 z-10 border-b border-border-subtle relative">
        <div class="w-full mx-auto px-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center gap-6 mb-4 md:mb-0">
                <h1 class="text-2xl font-extrabold text-electric-orange tracking-tight font-display">FlashDeckAi</h1>
                <div class="flex items-center gap-4 text-sm font-semibold">
                    <a href="index.html" class="text-text-muted hover:text-on-surface transition-colors pb-1">Deck</a>
                    <a href="study.html" class="text-electric-orange border-b-2 border-electric-orange pb-1">Study</a>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <span id="deck-status" class="text-sm font-semibold text-text-muted">Loading deck...</span>
            </div>
        </div>
    </nav>

    <!-- Sub Navbar for Deck Actions -->
    <div class="bg-[#121212] border-b border-border-subtle px-4 py-2 z-10 flex justify-between items-center text-sm">
        <div class="flex items-center gap-2">
            <span class="text-text-muted">Current Deck:</span>
            <span id="deck-name-display" class="font-semibold text-on-surface">Default Deck</span>
        </div>
        <div class="flex items-center gap-3">
            <input type="file" id="import-json-file" accept=".json" class="hidden">
            <button id="import-json-btn" class="text-text-muted hover:text-on-surface transition flex items-center gap-1" onclick="document.getElementById('import-json-file').click()">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Import State
            </button>
            <button id="export-json-btn" class="text-text-muted hover:text-on-surface transition flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Export State
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center p-6 bg-bg-base relative overflow-hidden">

        <!-- Progress Bar -->
        <div class="absolute top-0 left-0 w-full h-1 bg-bg-surface z-0">
            <div id="study-progress" class="h-full bg-electric-orange transition-all duration-300" style="width: 0%"></div>
        </div>

        <div id="study-container" class="w-full max-w-5xl h-[900px] flex flex-col relative z-10 hidden">
            <!-- The Card -->
            <div class="flex-1 flip-card cursor-pointer" id="flashcard">
                <div class="flip-card-inner">
                    <!-- Front -->
                    <div class="flip-card-front bg-bg-base border border-border-subtle rounded-2xl p-8 flex flex-col items-center justify-center shadow-xl">
                        <div id="card-front-content" class="card-content w-full"></div>
                        <p class="text-xs text-text-muted mt-8 absolute bottom-6">Click to flip</p>
                    </div>

                    <!-- Back -->
                    <div class="flip-card-back bg-bg-base border border-border-subtle rounded-2xl p-8 flex flex-col shadow-xl overflow-y-auto custom-scrollbar">
                        <div id="card-back-content" class="card-content w-full h-full flex flex-col justify-start"></div>
                    </div>
                </div>
            </div>

            <!-- Controls (shown when flipped) -->
            <div id="card-controls" class="mt-8 flex justify-center gap-4 opacity-0 transition-opacity duration-300 pointer-events-none">
                <button id="btn-again" class="px-6 py-3 bg-bg-surface border border-red-500 text-red-500 font-semibold rounded-xl hover:bg-red-500 hover:text-white transition shadow-lg flex flex-col items-center">
                    <span>Again</span>
                    <span id="interval-again" class="text-xs font-normal opacity-70 mt-1">&lt; 1m</span>
                </button>
                <button id="btn-hard" class="px-6 py-3 bg-bg-surface border border-orange-500 text-orange-500 font-semibold rounded-xl hover:bg-orange-500 hover:text-white transition shadow-lg flex flex-col items-center">
                    <span>Hard</span>
                    <span id="interval-hard" class="text-xs font-normal opacity-70 mt-1">10m</span>
                </button>
                <button id="btn-good" class="px-6 py-3 bg-bg-surface border border-green-500 text-green-500 font-semibold rounded-xl hover:bg-green-500 hover:text-white transition shadow-lg flex flex-col items-center">
                    <span>Good</span>
                    <span id="interval-good" class="text-xs font-normal opacity-70 mt-1">1d</span>
                </button>
                <button id="btn-easy" class="px-6 py-3 bg-bg-surface border border-blue-500 text-blue-500 font-semibold rounded-xl hover:bg-blue-500 hover:text-white transition shadow-lg flex flex-col items-center">
                    <span>Easy</span>
                    <span id="interval-easy" class="text-xs font-normal opacity-70 mt-1">4d</span>
                </button>
            </div>
        </div>

        <!-- Deck Summary / Empty State -->
        <div id="empty-state" class="w-full max-w-md text-center flex flex-col items-center justify-center hidden">
            <div class="w-20 h-20 bg-bg-surface rounded-full flex items-center justify-center mb-4 border border-border-subtle">
                <svg class="w-10 h-10 text-electric-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <h2 id="empty-title" class="text-2xl font-bold mb-2">Deck Dashboard</h2>
            <p id="empty-subtitle" class="text-text-muted mb-6">Ready for your session?</p>

            <!-- Statistics Panel -->
            <div id="deck-stats-container" class="bg-bg-surface border border-border-subtle rounded-xl p-4 mb-6 w-full grid grid-cols-2 gap-4">
                <div class="flex flex-col items-center p-3 bg-bg-base rounded-lg border border-border-subtle">
                    <span id="stat-due" class="text-2xl font-bold text-electric-orange">0</span>
                    <span class="text-xs font-semibold text-text-muted uppercase tracking-wide">Due Reviews</span>
                </div>
                <div class="flex flex-col items-center p-3 bg-bg-base rounded-lg border border-border-subtle">
                    <span id="stat-new" class="text-2xl font-bold text-blue-500">0</span>
                    <span class="text-xs font-semibold text-text-muted uppercase tracking-wide">New Cards</span>
                </div>
                <div class="flex flex-col items-center p-3 bg-bg-base rounded-lg border border-border-subtle">
                    <span id="stat-studied" class="text-xl font-bold text-green-500">0</span>
                    <span class="text-[10px] font-semibold text-text-muted uppercase tracking-wide mt-1">Studied Today</span>
                </div>
                <div class="flex flex-col items-center p-3 bg-bg-base rounded-lg border border-border-subtle">
                    <span id="stat-total" class="text-xl font-bold text-on-surface">0</span>
                    <span class="text-[10px] font-semibold text-text-muted uppercase tracking-wide mt-1">Total Cards</span>
                </div>
            </div>

            <div id="batch-config-container" class="bg-bg-surface border border-border-subtle rounded-xl p-6 mb-6 w-full text-left">
                <label class="block text-sm font-semibold text-on-surface mb-2">Batch size for new cards:</label>
                <input type="number" id="batch-size-input" class="w-full bg-bg-base border border-border-subtle rounded-lg px-4 py-2 text-on-surface focus:outline-none focus:border-electric-orange" value="20" min="1" max="1000">
            </div>

            <button id="start-batch-btn" class="w-full max-w-md px-6 py-3 bg-electric-orange text-on-surface font-semibold rounded-xl hover:bg-orange-600 transition mb-6 shadow-lg">Start Study Session</button>

            <div class="flex justify-center gap-4 w-full">
                <button id="reset-study-btn" class="hidden px-6 py-3 bg-bg-surface border border-border-subtle text-on-surface font-semibold rounded-xl hover:bg-bg-overlay transition">Study More</button>
                <a href="index.html" class="w-full px-6 py-3 bg-bg-surface border border-border-subtle text-on-surface font-semibold rounded-xl hover:bg-bg-overlay transition">Go to Deck Builder</a>
            </div>
        </div>

    </main>

    <script src="study.js"></script>
</body>
</html>
